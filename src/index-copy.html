<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <title>Todo App</title>
  </head>
  <body>

    <div class="app">
      <!--Sidebar-->
      <div id="sidebar">
        <div class="sidebar-main">
          <div class="sidebar-header">
            <div class="sidebar-left">
              <h1 class="logo">Todo</h1>
            </div>
            <div class="sidebar-right settings">
              <img src="./assets/settings.png" alt="" width="24px">
            </div>
          </div>
          <div class="sidebar-todos">
            <div class="sidebar-btn">
              <div class="sidebar-left">
                <img src="./assets/add_box.png" alt="" width="24px" height="24px">
                <p class=" add-btn">Add todo</p>
              </div>
              <div></div>
            </div>
            <div class="sidebar-btn">
              <div class="sidebar-left">
               <img src="./assets/inbox.png" alt="" width="16px">
                <p>Inbox</p>
              </div>
            </div>
            <div class="sidebar-btn">
              <div class="sidebar-left">
                <img src="./assets/calendar.png" alt="" width="16px">
                <p>Today</p>
              </div>
            </div>
            <div class="sidebar-btn">
              <div class="sidebar-left">
               <img src="./assets/all_inclusive.png" alt="" width="16px">
                <p>All todos</p>
              </div>
            </div>
          </div>
          <div class="projects">
            <div class="sidebar-btn projects-header">
              <p class="sidebar-left">Projects</p>
              <div class="add-project">
                <img src="./assets/add.png" alt="">
              </div>
            </div>
          </div>
        </div>

        <div class="footer">
          <div class="sidebar-btn">
            <p class="sidebar-left">About</p>
          </div>
        </div>

      </div>

      <!--Content-->
      <div id="content" class="content">
        <div class="content-container">
          <h1>Inbox</h1>
          <div class="todo-list">
            <div class="todo">
              <input class="todo-complete" type="radio" autocomplete="off"/>
              <p class="todo-title">This is a todo</p>
            </div>
            <div class="todo">
              <input class="todo-complete" type="radio" autocomplete="off"/>
              <p class="todo-title">This is another todo</p>
            </div>
          </div>
          <div class="add-todo">
            <img src="./assets/add_2.png" alt="" width=24px">
            <p>Add todo</p>
          </div>

          <button command="show-modal" commandfor="show-todo" >open</button>

          <dialog id="show-todo" >
            <div class="dialog-container">
              <div class="dialog-header">
                <div class="dialog-close" command="close" commandfor="show-todo">
                  <img src="./assets/close.png" alt="" command="close" commandfor="show-todo">
                </div>
              </div>
              <div class="dialog-content">
                <div class="dialog-content-main">
                  <div class="dialog-content-column">
                    <input class="todo-complete" type="radio" autocomplete="off">
                  </div>
                  <div class="dialog-content-column">
                    <textarea class="hidden" name="" id=""></textarea>
                    <textarea class="dialog-content-text dialog-h2" name="" id="" rows="1">This is a title</textarea>
                    <textarea class="dialog-content-text" name="" id="" rows="5">This is a description</textarea>
                  </div>
                </div>
                <div class="dialog-content-aside">
                  <div class="dialog-aside-item">
                    <p>Project</p>
                    <select name="project" id="">
                      <option value="default" disabled>My Projects</option>
                      <option value="inbox">Inbox</option>
                    </select>
                  </div>
                  <div class="dialog-aside-item">
                    <p>Date</p>
                    <input type="date" min="">
                  </div>
                  <div class="dialog-aside-item">
                    <p>Priority</p>
                    <select name="priority" id="" autocomplete="off">
                      <option value="high">High</option>
                      <option value="medium">Medium</option>
                      <option value="low">Low</option>
                      <option value="none" selected>None</option>
                    </select>
                  </div>
                  <div class="dialog-aside-item">
                    <p>Labels</p>
                  </div>
                </div>
              </div>
            </div>
          </dialog>

        </div>
      </div>
    </div>

  </body>
</html>
