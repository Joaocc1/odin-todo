<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <title>Todo App</title>
  </head>
  <body>

    <div class="app">
      <!--Sidebar-->
      <div class="sidebar">
        <div class="sidebar-main">
          <div class="sidebar-header">
            <div class="sidebar-left">
              <h1 class="logo">Todo</h1>
            </div>
            <div class="sidebar-right settings">
              <img src="./assets/settings.png" alt="" width="16px">
            </div>
          </div>
          <div class="sidebar-todos">
            <div class="sidebar-btn">
              <div class="sidebar-left">
                <img src="./assets/add_box.png" alt="" width="16px" height="16px">
                <p class=" add-btn">Add todo</p>
              </div>
              <div></div>
            </div>
            <div class="sidebar-btn">
              <div class="sidebar-left">
               <img src="./assets/all_inclusive.png" alt="" width="16px">
                <p>All todos</p>
              </div>
            </div>
            <div class="sidebar-btn">
              <div class="sidebar-left">
               <img src="./assets/inbox.png" alt="" width="16px">
                <p>Inbox</p>
              </div>
            </div>
            <div class="sidebar-btn">
              <div class="sidebar-left">
                <img src="./assets/calendar.png" alt="" width="16px">
                <p>Today</p>
              </div>
            </div>
          </div>
          <div class="projects">
            <div class="sidebar-btn projects-header">
              <p class="sidebar-left">Projects</p>
              <div class="add-project">
                <img src="./assets/add.png" alt="">
              </div>
            </div>
          </div>
        </div>

        <div class="footer">
          <div class="sidebar-btn">
            <p class="sidebar-left">About</p>
          </div>
